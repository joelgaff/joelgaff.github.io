# Site settings
title: Joel Gaff, Jr.
email: joelga@hey.com
description:
  Joel Gaff, Jr. is a software developer based in Portland, Oregon & Traverse City, Michigan, USA.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://joelgaff.com" # the base hostname & protocol for your site, e.g. http://example.com
github_username: joelgaff
twitter_username: joelga
image: /images/joel-og.jpg
twitter:
  username: joelga
  card: summary
tagline: Rails builder for hire. Contracts or full-time. Rails · SQLite · Hotwire. Shipping <a href="https://podiumstats.com" target="_blank">podiumstats.com</a> &amp; <a href="https://cucamonga.app" target="_blank">cucamonga.app</a>. Portland, OR.

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-paginate

# Pagination settings
paginate: 10
paginate_path: "/page:num/"

# Header navigation pages
header_pages:
  - index.html
  # List pages to show in navigation (empty = no nav links)

# Permalink structure (custom to preserve Google rankings)
permalink: /blog/:title/

# Default layouts and social share image
defaults:
  - scope:
      path: ""
    values:
      image: /images/joel-og.jpg
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

