# Site settings
title: Joel Gaff, Jr.
email: joel@joelgaff.com
description:
  Joel Gaff, Jr. is a Rails developer based in Portland, Oregon.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://joelgaff.com" # the base hostname & protocol for your site, e.g. http://example.com
github_username: joelgaff
twitter_username: joelga
image: /images/joel-og.jpg
twitter:
  username: joelga
  card: summary
tagline: Joel Gaff, Jr. is a Rails builder for hire. Contracts or full-time. Rails · SQLite · Hotwire. Shipping railsguild.com, omarchyguild.com, cucamonga.app &amp; podiumstats.com. Portland, OR.

# The podcast I co-host. Referenced by the homepage banner and the about page,
# so the link lives here rather than in two templates.
podcast:
  name: The Pingback Podcast
  tagline: Ruby, tech &amp; more
  url: https://pingbackpodcast.com
  cohost: Greg Molnar
  cohost_url: https://greg.molnar.io/   # molnar.io 301s here

# Build settings
theme: minima
exclude:
  - "z drafts"
plugins:
  - jekyll-feed
  - jekyll-paginate

# Pagination settings
paginate: 10
paginate_path: "/page:num/"

# Header navigation pages
header_pages:
  - index.html
  # List pages to show in navigation (empty = no nav links)

# Permalink structure (custom to preserve Google rankings)
permalink: /blog/:title/

# Default layouts and social share image
defaults:
  - scope:
      path: ""
    values:
      image: /images/joel-og.jpg
      layout: "default"   # pages no longer declare their own layout
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

