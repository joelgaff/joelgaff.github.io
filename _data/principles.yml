# /about "How I work"
- title: Manager of one
  body: >-
    I execute without supervision. No one has to chase me for a status update or
    make sure I'm getting my part done.

- title: "Customer #1"
  body: >-
    Most projects start as something I want for myself, so I'm using them every
    day before anyone else does.

- title: Boring stack, on purpose
  body: Rails, SQLite, Hotwire, one server. Fewer moving parts means more shipping.

- title: Written down
  body: I try to share what I'm working on and how I work.
