<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body{% if site.tree_bg %} class="trees-{{ site.tree_bg }}"{% endif %}>
    <script>(function(){var t=new URLSearchParams(location.search).get("trees");if(t!==null){document.body.className=document.body.className.replace(/\btrees-\S+/g,"").trim();if(/^[a-z-]+$/.test(t))document.body.classList.add("trees-"+t);}})();</script>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
