<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
      <img class="site-mark" src="{{ "/images/signature.png" | relative_url }}" alt="{{ site.title | escape }}">
    </a>
    <nav class="site-nav">
      {%- assign items = "Home|/;Writing|/writing/;Work|/work/;/now|/now/;Hire|/hire/;About|/about/" | split: ";" -%}
      {%- for item in items -%}
        {%- assign parts = item | split: "|" -%}
        <a class="page-link{% if page.url == parts[1] %} active{% endif %}" href="{{ parts[1] | relative_url }}">{{ parts[0] }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
