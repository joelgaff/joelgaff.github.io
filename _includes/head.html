<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if page.layout == "post" -%}
  <link rel="alternate" type="text/markdown" href="{{ page.url | append: ".md" | replace: "/.md", ".md" | relative_url }}">
  {%- endif -%}
  <link rel="icon" href="{{ "/images/signature.png" | relative_url }}" type="image/png">
</head>
