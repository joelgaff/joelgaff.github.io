<section class="newsletter" aria-labelledby="newsletter-heading">
  <h2 id="newsletter-heading" class="newsletter-heading">Get new posts by email</h2>
  <p class="newsletter-desc">Occasional notes on building Rails apps, Omarchy, and what I'm working on. No spam, unsubscribe anytime.</p>
  <form action="https://buttondown.com/api/emails/embed-subscribe/joelga" method="post" class="embeddable-buttondown-form newsletter-form">
    <label for="bd-email" class="newsletter-label">Email address</label>
    <div class="newsletter-row">
      <input type="email" name="email" id="bd-email" placeholder="you@example.com" autocomplete="email" required>
      <input type="hidden" name="embed" value="1">
      <button type="submit">Subscribe</button>
    </div>
  </form>
</section>
