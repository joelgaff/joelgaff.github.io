---
layout: home
---

<div>
<p class="header-tagline"> {{ site.tagline }} </p>
<p class="header-tagline">
  <a id="contact-email" href="#">email me</a>
  <noscript>joel [at] joelgaff [dot] com</noscript>
</p>
</div>

<script>
  (function () {
    var el = document.getElementById('contact-email');
    if (!el) return;
    var user = 'joel';
    var domain = 'joelgaff.com';
    var addr = user + String.fromCharCode(64) + domain;
    el.setAttribute('href', 'mailto:' + addr);
    el.textContent = addr;
  })();
</script>
